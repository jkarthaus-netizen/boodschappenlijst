<style>

  .menuwindow button{ width:100%; margin-bottom:8px; }
  #toast{

    background:var(--ink); color:#fff; border-radius:12px; padding:10px 16px; font-size:.9rem;

  hr.sep{ border:0; border-top:1px solid var(--line); margin:14px 0; }

(function(){
'use strict';
var KEY = 'boodschappen-app-v1';

function $(sel, root){ return (root||document).querySelector(sel); }

  });
}
function uid(p){ return (p||'id') + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function num(v){ var n = parseFloat(String(v).replace(',','.')); return isFinite(n) ? n : null; }
var UNIT_FORMS = [
  ['stuk','stuks'],
  ['gram','gram'],
  ['kg','kg'],
  ['liter','liter'],
  ['ml','ml'],
  ['pak','pakken'],
  ['pakje','pakjes'],
  ['fles','flessen'],
  ['flesje','flesjes'],
  ['blik','blikken'],
  ['blikje','blikjes'],
  ['doos','dozen'],
  ['zak','zakken'],
  ['zakje','zakjes'],

  ['potje','potjes'],
  ['bakje','bakjes'],
  ['beker','bekers'],
  ['kuipje','kuipjes'],
  ['broodje','broodjes'],
  ['bol','bollen'],
  ['plak','plakken'],
  ['snee','sneetjes'],
  ['bos','bossen'],
  ['krop','kroppen'],
  ['struik','struiken']
];
var UNIT_ALIASES = { 'g':'gram', 'gr':'gram', 'l':'liter', 'ltr':'liter' };
function normUnit(u){
  u = String(u===undefined||u===null?'':u).trim().toLowerCase();
  if (!u) return '';
  if (UNIT_ALIASES[u]) u = UNIT_ALIASES[u];
  for (var i=0; i<UNIT_FORMS.length; i++){
    if (UNIT_FORMS[i][0] === u || UNIT_FORMS[i][1] === u) return UNIT_FORMS[i][0];
  }
  return u;
}
function unitLabel(amt, unit){
  var orig = String(unit===undefined||unit===null?'':unit).trim();
  if (!orig) return '';
  var s = normUnit(orig);
  for (var i=0; i<UNIT_FORMS.length; i++){
    if (UNIT_FORMS[i][0] === s){
      return (num(amt) === 1) ? UNIT_FORMS[i][0] : UNIT_FORMS[i][1];
    }
  }
  return orig; /* onbekende eenheid ongemoeid laten */
}
function fmtNum(n){ var x = Number(n); if(!isFinite(x)) return ''; return String(Math.round(x*100)/100); }
function storeById(id){ return S.stores.find(function(s){ return s.id===id; }); }
function locById(stid, locid){ var st = storeById(stid); return st ? st.locations.find(function(l){ return l.id===locid; }) : null; }
function prodById(id){ return S.products.find(function(p){ return p.id===id; }); }
function storeIdx(id){ var n = -1; S.stores.forEach(function(s,i){ if (s.id===id) n=i; }); return n; }
function locIdx(stid, id){ var st = storeById(stid); if (!st) return -1; var n = -1; st.locations.forEach(function(l,i){ if (l.id===id) n=i; }); return n; }

  if ((sa<0?1:0) !== (sb<0?1:0)) return (sa<0?1:0) - (sb<0?1:0); /* zonder winkel onderaan */
  if (sa !== sb) return sa - sb;
  var la = locIdx(a.storeId, a.locationId), lb = locIdx(b.storeId, b.locationId);
  if ((la<0?1:0) !== (lb<0?1:0)) return (la<0?1:0) - (lb<0?1:0); /* zonder plek onderaan binnen de winkel */
  if (la !== lb) return la - lb;
  return (a.name||'').localeCompare(b.name||'', 'nl');
}
function recipeById(id){ return S.recipes.find(function(r){ return r.id===id; }); }
function moveRecipe(id, dir){
  var i = -1;
  for (var k=0; k<S.recipes.length; k++){ if (S.recipes[k] && S.recipes[k].id===id){ i=k; break; } }
  if (i<0) return false;
  var j = i + (dir<0 ? -1 : 1);
  if (j<0 || j>=S.recipes.length) return false;
  var r = S.recipes.splice(i,1)[0];
  S.recipes.splice(j,0,r);
  save();
  return true;
}

/* ---------- state ---------- */
function normalizeState(o){
  if (!o || typeof o!=='object') o = {};
  if (o.version !== 1) o.version = 1;
  if (!o.appVersion) o.appVersion = 1;
  ['stores','products','recipes','list','recent'].forEach(function(k){ if(!Array.isArray(o[k])) o[k]=[]; });
  return o;
}
function mergeRecent(a, b){
  var by = {}, out = [];
  a.concat(b).forEach(function(x){
    if (!x || !x.pid) return;
    var cur = by[x.pid];
    if (!cur) by[x.pid] = { pid:x.pid, at:x.at||0 };
    else if ((x.at||0) > cur.at) cur.at = x.at||0;
  });
  Object.keys(by).forEach(function(k){ out.push(by[k]); });
  out.sort(function(p,q){ return q.at - p.at; });
  return out.slice(0,50);
}
function mergeStates(base, old){
  /* base = nieuwere app-versie uit dit bestand; old = eerder opgeslagen gegevens */
  ['products','recipes'].forEach(function(k){
    var ids = {};
    base[k].forEach(function(x){ ids[x.id] = 1; });
    old[k].forEach(function(x){ if(!ids[x.id]) base[k].push(x); });
  });
  base.list = old.list; /* de huidige boodschappenlijst is van de gebruiker */
  base.recent = mergeRecent(base.recent, old.recent);
  return base;
}
function loadState(){
  var embedded = null, ls = null;
  try { embedded = normalizeState(JSON.parse($('#app-data').textContent)); } catch(e){}
  try { ls = normalizeState(JSON.parse(localStorage.getItem(KEY))); } catch(e){}
  if (embedded && ls){
    if ((embedded.appVersion||0) > (ls.appVersion||0)) return mergeStates(embedded, ls);
    if ((ls.appVersion||0) > (embedded.appVersion||0)) return ls;
    return ((ls.savedAt||0) >= (embedded.savedAt||0)) ? ls : embedded;
  }
  return ls || embedded || normalizeState(null);
}
var S = loadState();
['stores','products','recipes','list','recent'].forEach(function(k){ if(!Array.isArray(S[k])) S[k]=[]; });

function save(){
  S.savedAt = Date.now();
  S.rev = (S.rev||0) + 1;
  S.by = DEV;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  schedulePush();
}

/* ---------- export / import ---------- */
function download(filename, text, type){
  var blob = new Blob([text], {type:type||'application/octet-stream'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 100);
}

/* ---------- basket logic ---------- */
function touchRecent(pid){
  if (!pid || !prodById(pid)) return;
  var arr = S.recent, e = null, i = 0;
  for (i=0; i<arr.length; i++){ if (arr[i] && arr[i].pid === pid){ e = arr[i]; break; } }
  if (e) arr.splice(i,1);
  else e = { pid:pid, at:0 };
  e.at = Date.now();
  arr.unshift(e);
  if (arr.length > 50) arr.length = 50;
}
function addToBasket(o){
  var amt = num(o.amount); if (amt==null || amt<0) amt = 1;
  var cand = S.list.find(function(it){
    if (!!it.productId !== !!o.productId) return false;
    if (it.productId) return it.productId === o.productId; /* zelfde product = altijd samenvoegen, ook bij afwijkende eenheid */
    return (it.name||'').toLowerCase() === (o.name||'').toLowerCase() && (it.unit||'') === (o.unit||'');
  });
  if (cand){
    cand.amount = (num(cand.amount)||0) + amt;
    /* herkomst: alle ingrediëntenlijsten noemen waaruit het deze keer is toegevoegd */
    (o.origins||[]).forEach(function(or){ if (or && cand.origins.indexOf(or)<0) cand.origins.push(or); });
    if (o.comment && !cand.comment) cand.comment = o.comment;
    touchRecent(o.productId);
    save();
    return cand;
  }
  var item = {
    id: uid('li'), productId: o.productId||null, name: o.name||'',
    amount: amt, unit: o.unit||'stuk', comment: o.comment||'',
    storeId: o.storeId||null, locationId: o.locationId||null,
    origins: (o.origins||[]).slice(), done:false
  };
  S.list.push(item);
  touchRecent(o.productId);
  save();
  return item;
}
function addRecipeItemToList(r, ri){
  if (ri.productId){
    var p = prodById(ri.productId);
    if (p){
      addToBasket({ productId:p.id, name:p.name, amount:ri.amount, unit:ri.unit||p.unit||'stuk', comment:ri.comment, origins:[r.name] });
      return true;
    }
  }
  if ((ri.name||'').trim()){
    addToBasket({ name:ri.name, amount:ri.amount, unit:ri.unit, comment:ri.comment, storeId:null, locationId:null, origins:[r.name] });
    return true;
  }
  return false;
}
function addRecipeToList(r){
  var n = 0;
  r.items.forEach(function(ri){ if (addRecipeItemToList(r, ri)) n++; });
  return n;
}
function resolveItem(it){
  var p = it.productId ? prodById(it.productId) : null;
  if (p) return { name:p.name, unit:it.unit, comment:it.comment, storeId:p.storeId, locationId:p.locationId };
  var st = it.storeId ? storeById(it.storeId) : null;
  return { name:it.name, unit:it.unit, comment:it.comment, storeId: st ? it.storeId : null, locationId: it.locationId };
}
function storeLabel(id){ var st = storeById(id); return st ? st.name : 'Onbekende winkel'; }
function locLabel(st, locid){
  var l = locid ? locById(st, locid) : null;
  return l ? l.name : null;
}

function linkProductToRecipes(prod, recSel){
  /* prod koppelen aan/loskoppelen van ingrediëntenlijsten volgens aanvinkstatus */
  S.recipes.forEach(function(r){
    var row = r.items.find(function(ri){ return ri.productId === prod.id; });
    var on = !!(recSel && recSel[r.id]);
    if (on && !row){
      r.items.push({ productId: prod.id, name: prod.name, amount:'', unit: prod.unit||'', comment:'' });
    } else if (!on && row){

function locOptionsFor(storeId, selId){
  var st = storeById(storeId); var out = '';
  if (st) st.locations.forEach(function(l){
    out += '<option value="'+l.id+'"'+(l.id===selId?' selected':'')+'>'+esc(l.name)+'</option>';
  });
  return out;
}
function searchResults(qstr){
  var box = $('#lresults'); if (!box) return;
  var q = qstr.trim().toLowerCase();
  var html = '';
  if (q){
    var hits = S.products.filter(function(p){
      return p.name.toLowerCase().indexOf(q) >= 0;
    }).slice(0, 8);
    html += hits.map(function(p){
      return '<button class="result" data-addp="'+p.id+'"><span><b>➕ '+esc(p.name)+'</b></span><span class="meta">'+esc(storeLabel(p.storeId))+(locLabel(p.storeId,p.locationId)?' · '+esc(locLabel(p.storeId,p.locationId)):'')+'</span></button>';
    }).join('');
  } else {
    html += '<p class="hint">Begin te typen... Bekende producten verschijnen hier en kun je met één tik toevoegen.</p>';
  }
  html += '<button class="btn primary" data-newp="1" style="width:100%;margin-top:6px">➕ Nieuw product</button>';
  box.innerHTML = html;
  box.querySelectorAll('[data-addp]').forEach(function(b){
    b.addEventListener('click', function(){
      var p = prodById(b.dataset.addp); if (!p) return;
      addToBasket({ productId:p.id, name:p.name, amount:1, unit:p.unit||'stuk', origins:[] });
      toast('"'+p.name+'" toegevoegd (aantal kun je in de lijst aanpassen)');
      refreshBasket();
    });
  });
  var np = box.querySelector('[data-newp]');
  if (np) np.addEventListener('click', function(){
    openProductModal(null, function(prod){
      addToBasket({ productId: prod.id, name: prod.name, amount: 1, unit: prod.unit||'stuk', origins: [] });
      toast('"'+prod.name+'" op de boodschappenlijst gezet');
    });
  });
}
function refreshBasket(){
  var box = $('#basketBox'); if (!box) return;
  if (!S.list.length){
    box.innerHTML = '<p class="hint">Nog niets op de lijst. Voeg hierboven ingrediëntenlijsten en producten toe.</p>';
  } else {
    box.innerHTML = S.list.map(function(it){
      var res = resolveItem(it);
      var nameHtml = it.productId
        ? '<b>'+esc(res.name)+'</b>'
        : '<input type="text" class="nameinput" data-it="'+it.id+'" data-f="name" value="'+esc(it.name)+'">';
      var meta = [];
      if (it.origins && it.origins.length) meta.push('<span class="tag">🍲 '+esc(it.origins.join(', '))+'</span>');
      return '<div class="itemrow">'+
        '<div class="body">'+
          '<div class="nameline">'+
            '<span class="nm">'+nameHtml+'</span>'+
            (meta.length ? '<span class="origins">'+meta.join('')+'</span>' : '')+
          '</div>'+
          '<div class="rowmini">'+
            '<div class="qty">'+
              '<input type="text" inputmode="decimal" data-it="'+it.id+'" data-f="amount" value="'+esc(fmtNum(it.amount))+'">'+
              '<input type="text" class="unit" list="units" data-it="'+it.id+'" data-f="unit" value="'+esc(unitLabel(it.amount, it.unit))+'">'+
            '</div>'+
            '<input type="text" class="note" placeholder="opmerking…" data-it="'+it.id+'" data-f="comment" value="'+esc(it.comment)+'">'+
          '</div>'+
        '</div>'+
        '<button class="iconbtn danger" data-del="'+it.id+'" title="Van lijst">🗑</button>'+
      '</div>';
    }).join('');
    box.querySelectorAll('input[data-it]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var it = S.list.find(function(x){ return x.id===inp.dataset.it; }); if (!it) return;
        if (inp.dataset.f==='amount'){ var n = num(inp.value); if (n!=null && n>=0) it.amount = n; }
        else it[inp.dataset.f] = inp.value;
        save();
        if (inp.dataset.f==='amount'){ refreshBasket(); return; } /* stuk/stuks direct bijwerken */
      });
    });
    box.querySelectorAll('[data-del]').forEach(function(btn){
      btn.addEventListener('click', function(){
        S.list = S.list.filter(function(x){ return x.id!==btn.dataset.del; });
        save(); refreshBasket(); tabBadge();
      });
    });
  }
  refreshListActions();
}
function refreshListActions(){
  var box = $('#listActions'); if (!box) return;
  if (S.list.length){
    box.innerHTML = '<div class="rowflex" style="margin-top:12px">'+
      '<button class="btn danger" id="clearList">🗑 Lijst wissen</button></div>';
    $('#clearList').addEventListener('click', function(){
      if (!confirm('De hele boodschappenlijst wissen?')) return;
      S.list = []; save(); refreshBasket(); tabBadge();
    });
  } else {
    box.innerHTML = '';
  }
  var old = $('#makeRoute'); if (old) old.remove();
  var btn = document.createElement('button');
  btn.className = 'btn primary big'; btn.id = 'makeRoute';
  btn.innerHTML = '🧭 Maak boodschappenlijst voor vandaag <span class="badge">'+S.list.length+'</span>';
  if (!S.list.length) btn.disabled = true;
  btn.addEventListener('click', function(){ switchTab('route'); });
  view.appendChild(btn);
}

/* ---------- TAB: ROUTE ---------- */
function renderRoute(){
  if (!S.list.length){
    view.innerHTML = '<div class="card empty"><span class="big">🧺</span><b>Nog geen boodschappen op de lijst.</b><br>'+
      '<button class="btn primary" data-goto="lijst">Naar Bestellen</button></div>';
    view.querySelectorAll('[data-goto]').forEach(function(b){
      b.addEventListener('click', function(){ switchTab(b.dataset.goto); });
    });
    return;
  }
  var filter = S.routeStore || '';
  var total = S.list.length;
  var done = S.list.filter(function(i){ return i.done; }).length;

  var html = '<div class="card"><div class="shophead">'+
    '<select id="routeStoreFilter"><option value="">Alle winkels</option>'+
    S.stores.map(function(s){ return '<option value="'+s.id+'"'+(filter===s.id?' selected':'')+'>'+esc(s.name)+'</option>'; }).join('')+
    '</select>'+
    '<div class="bar"><div id="progressBar" style="width:'+Math.round(done/total*100)+'%"></div></div>'+
    '<span id="progressText">'+done+' / '+total+'</span>'+
    '</div>';

  html += buildRouteGroups(filter);
  html += '<hr class="sep"><div class="rowflex">'+
    '<button class="btn primary" id="removeDone">✓ Klaar</button>'+
  '</div></div>';

  view.innerHTML = html;

  $('#routeStoreFilter').addEventListener('change', function(e){
    S.routeStore = e.target.value; save(); renderRoute();
  });

  view.querySelectorAll('input[data-done]').forEach(function(cb){
    cb.addEventListener('change', function(){
      var it = S.list.find(function(x){ return x.id===cb.dataset.done; }); if (!it) return;
      it.done = cb.checked; save();
      cb.closest('.shopitem').classList.toggle('done', it.done);
      var total2 = S.list.length;
      var done2 = S.list.filter(function(i){ return i.done; }).length;
      $('#progressBar').style.width = Math.round(done2/total2*100)+'%';
      $('#progressText').textContent = done2+' / '+total2;
      var lg = cb.closest('.locgroup');
      if (lg){ var bo = lg.querySelector('.loccount'); if (bo) bo.textContent = locDoneCount(lg)+'/'+lg.querySelectorAll('input[data-done]').length; }
      tabBadge();
    });
  });
  view.querySelectorAll('button[data-delroute]').forEach(function(b){
    b.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      S.list = S.list.filter(function(x){ return x.id!==b.dataset.delroute; });
      save(); renderRoute(); tabBadge();
    });
  });
  $('#removeDone').addEventListener('click', function(){
    var n = S.list.filter(function(i){ return i.done; }).length;
    if (!n){ toast('Niets afgevinkt'); return; }
    S.list = S.list.filter(function(i){ return !i.done; });
    save(); renderRoute(); tabBadge();
    toast(n+' product'+(n===1?'':'en')+' van de lijst');
  });
}
function locDoneCount(locEl){
  var d = 0;
  locEl.querySelectorAll('input[data-done]').forEach(function(b){ if (b.checked) d++; });
  return d;
}
function routeRow(it){
  var res = resolveItem(it);
  return '<label class="shopitem'+(it.done?' done':'')+'">'+
    '<input type="checkbox" data-done="'+it.id+'"'+(it.done?' checked':'')+'>'+
    '<div class="body">'+
      '<b>'+esc(res.name||'(zonder naam)')+'</b> '+
      '<span class="aantal">'+esc(fmtNum(it.amount)+' '+unitLabel(it.amount, it.unit))+'</span>'+
      (res.comment?'<div class="note">📌 '+esc(res.comment)+'</div>':'')+
    '</div>'+
    '<button class="iconbtn danger" data-delroute="'+it.id+'" title="Van lijst">🗑</button>'+
  '</label>';
}
function buildRouteGroups(filter){
  var items = S.list.map(function(it){ return { it:it, res:resolveItem(it) }; });
  var html = '';
  S.stores.forEach(function(store){
    if (filter && store.id!==filter) return;
    var si = items.filter(function(x){ return x.res.storeId===store.id; });
    if (!si.length) return;
    html += '<div class="shopgroup"><h4>🏬 '+esc(store.name)+'</h4>';
    store.locations.forEach(function(l, i){
      var li = si.filter(function(x){ return x.res.locationId===l.id; });
      if (!li.length) return;
      var dn = li.filter(function(x){ return x.it.done; }).length;
      html += '<div class="locgroup"><h3><span class="locnr">'+(i+1)+'</span> '+esc(l.name)+' <span class="dim loccount">'+dn+'/'+li.length+'</span></h3>'+
        li.map(function(x){ return routeRow(x.it); }).join('')+'</div>';
    });
    var rem = si.filter(function(x){ return !locById(store.id, x.res.locationId); });
    if (rem.length){
      var dn2 = rem.filter(function(x){ return x.it.done; }).length;
      html += '<div class="locgroup noloc"><h3><span class="locnr">?</span> Zonder vaste plek <span class="dim loccount">'+dn2+'/'+rem.length+'</span></h3>'+
        rem.map(function(x){ return routeRow(x.it); }).join('')+'</div>';
    }
    html += '</div>';
  });
  if (!filter){
    var overig = items.filter(function(x){ return !storeById(x.res.storeId); });
    if (overig.length){
      var dn3 = overig.filter(function(x){ return x.it.done; }).length;
      html += '<div class="shopgroup"><h4>❓ Winkel onbekend / nog in te delen</h4><div class="locgroup noloc"><h3><span class="locnr">?</span> Overig <span class="dim loccount">'+dn3+'/'+overig.length+'</span></h3>'+
        overig.map(function(x){ return routeRow(x.it); }).join('')+'</div></div>';
    }
  }
  return html;
}

/* ---------- TAB: PRODUCTEN ---------- */
var prodQuery = '';
function renderProducten(){
  var q = prodQuery.trim().toLowerCase();
  var prods = S.products.filter(function(p){ return !q || p.name.toLowerCase().indexOf(q)>=0; })
                        .sort(cmpProducts);
  view.innerHTML =
  '<div class="card">'+
    '<h2>Producten <span class="dim">('+S.products.length+')</span></h2>'+
    '<p class="hint">Alle bekende producten, gesorteerd per winkel en per plek in de winkel.</p>'+
    '<div class="rowflex" style="margin-bottom:10px">'+
      '<input type="text" class="search" id="prodQ" placeholder="Zoeken..." value="'+esc(prodQuery)+'" style="flex:1">'+
      '<button class="btn primary" id="newProd">➕ Nieuw product</button>'+
    '</div>'+
    '<div id="prodRows">'+
    (prods.length ? prods.map(function(p){ return prodRow(p); }).join('') :
      '<p class="hint">'+(S.products.length?'Geen producten gevonden voor deze zoekterm.':'Nog geen producten. Voeg hier je eerste product toe, daarna kun je het steeds hergebruiken.')+'</p>')+
    '</div>'+
  '</div>';
  $('#prodQ').addEventListener('input', function(e){ prodQuery = e.target.value; renderProducten(); });
  $('#newProd').addEventListener('click', function(){ openProductModal(null, null); });
  bindProdRows();
}
function prodRow(p){
  var inLists = S.recipes.filter(function(r){ return r.items.some(function(i){ return i.productId===p.id; }); });
  var st = storeById(p.storeId);
  var loc = st ? locById(st.id, p.locationId) : null;
  var locIdx = st ? st.locations.findIndex(function(l){ return l.id===p.locationId; }) + 1 : 0;
  return '<div class="itemrow">'+
    '<div class="body"><b>'+esc(p.name)+'</b> <span class="dim">'+esc(p.unit||'')+'</span>'+
      '<div class="sub">'+
        '<span class="tag">'+(st?esc(st.name):'Winkel onbekend')+(loc?' · '+locIdx+'. '+esc(loc.name):'')+'</span>'+
        inLists.map(function(r){ return '<span class="tag">'+esc(r.name)+'</span>'; }).join('')+
        (p.comment?'<span class="tag">📌 '+esc(p.comment)+'</span>':'')+
      '</div>'+
    '</div>'+
    '<button class="iconbtn" data-editp="'+p.id+'" title="Wijzig">✏️</button>'+
    '<button class="iconbtn" data-addl="'+p.id+'" title="Op boodschappenlijst">🛒</button>'+
    '<button class="iconbtn danger" data-rmp="'+p.id+'" title="Verwijderen">🗑</button>'+
  '</div>';
}
function bindProdRows(){
  var rows = $('#prodRows'); if (!rows) return;
  rows.querySelectorAll('[data-editp]').forEach(function(b){
    b.addEventListener('click', function(){ openProductModal(prodById(b.dataset.editp), null); });
  });
  rows.querySelectorAll('[data-addl]').forEach(function(b){
    b.addEventListener('click', function(){
      var p = prodById(b.dataset.addl); if (!p) return;
      addToBasket({ productId:p.id, name:p.name, amount:1, unit:p.unit||'stuk', origins:[] });
      toast('"'+p.name+'" op de boodschappenlijst');
    });
  });
  rows.querySelectorAll('[data-rmp]').forEach(function(b){
    b.addEventListener('click', function(){
      var p = prodById(b.dataset.rmp); if (!p) return;
      if (!confirm('"'+p.name+'" verwijderen? In ingrediëntenlijsten wordt het bewaard als vast ingrediënt.')) return;
      S.products = S.products.filter(function(x){ return x.id!==p.id; });
      S.recent = S.recent.filter(function(x){ return x.pid!==p.id; });
      S.recipes.forEach(function(r){ r.items.forEach(function(ri){ if (ri.productId===p.id){ ri.productId=null; if(!ri.name) ri.name=p.name; } }); });
      S.list.forEach(function(it){ if (it.productId===p.id){ it.productId=null; if(!it.name) it.name=p.name; } });
      save(); renderProducten(); tabBadge();
    });
  });
}

/* ---------- TAB: RECEPTEN ---------- */
var expandedRecipe = null;
function renderRecepten(){
  view.innerHTML =
  '<div class="card">'+
    '<h2>Ingrediëntenlijsten <span class="dim">('+S.recipes.length+')</span></h2>'+
    '<p class="hint">Elke lijst is de ingrediëntenlijst van een gerecht of gelegenheid. Bij 📝 Bestellen zet je zo\u2019n lijst in één tik (of per product) op de boodschappenlijst. Met de ↑- en ↓-knoppen bepaal je jullie eigen volgorde; die zie je ook terug bij 📝 Bestellen.</p>'+
    '<button class="btn primary" id="newRec">➕ Nieuwe ingrediëntenlijst</button>'+
  '</div>'+
  S.recipes.map(function(r, idx){ return recipeCard(r, idx); }).join('');
  $('#newRec').addEventListener('click', function(){
    var r = { id:uid('r'), name:'', items:[] };
    S.recipes.push(r); expandedRecipe = r.id; save(); renderRecepten();
    var inp = view.querySelector('[data-rname="'+r.id+'"]'); if (inp) inp.focus();
  });
  S.recipes.forEach(bindRecipeCard);
}
function recipeCard(r, idx){
  idx = (typeof idx === 'number') ? idx : S.recipes.indexOf(r);
  var open = expandedRecipe===r.id;
  var body = '';
  if (open){
    body = '<div style="margin-top:10px">'+
      (r.items.map(function(ri, i){ return recipeRow(ri, i); }).join('') || '<p class="hint">Nog geen ingrediënten. Voeg hieronder rijen toe.</p>')+
      '<div class="rowflex" style="margin-top:6px">'+
        '<button class="btn small" data-addrow="'+r.id+'">➕ Rij</button>'+
        '<button class="btn small" data-newprod="'+r.id+'">➕ Nieuw product</button>'+
        '<span class="dim" style="font-size:.8rem">Rij = product + aantal + eenheid + opmerking</span>'+
      '</div>'+
    '</div>';
  }
  return '<div class="card rcard">'+
    '<div class="rhead">'+
      '<div class="rhname">'+
        (open
          ? '<input type="text" data-rname="'+r.id+'" value="'+esc(r.name)+'" placeholder="Naam (bijv. Pasta carbonara)" style="width:100%">'
          : '<b data-openrec-inline="'+r.id+'" style="cursor:pointer;font-size:1.02rem">'+esc(r.name||'(naamloos)')+'</b> <span class="dim" style="font-size:.8rem">'+r.items.length+' ing.</span>')+
      '</div>'+
      '<div class="rhactions">'+
        '<div class="mover">'+
          '<button class="iconbtn'+(idx>0?'':' ghost')+'" data-mup="'+r.id+'" title="Omhoog">↑</button>'+
          '<button class="iconbtn'+(idx<S.recipes.length-1?'':' ghost')+'" data-mdown="'+r.id+'" title="Omlaag">↓</button>'+
        '</div>'+
        '<button class="btn small" data-openrec="'+r.id+'">'+(open?'▲ Dicht':'▼ Open')+'</button>'+
        '<button class="iconbtn danger" data-rmrec="'+r.id+'">🗑</button>'+
      '</div>'+
    '</div>'+body+
  '</div>';
}
function recipeRow(ri, i){
  return '<div class="rrow itemrow" data-ridx="'+i+'">'+
    '<div class="body">'+
      '<div class="nameline"><span class="nm"><select data-f="productId">'+productOptions(ri.productId)+'</select></span></div>'+
      (ri.productId?'':'<input type="text" class="freename" data-f="name" value="'+esc(ri.name)+'" placeholder="Naam ingrediënt">')+
      '<div class="rowmini">'+
        '<div class="qty">'+
          '<input type="text" inputmode="decimal" data-f="amount" value="'+esc(fmtNum(ri.amount))+'" placeholder="aantal">'+
          '<input type="text" class="unit" list="units" data-f="unit" value="'+esc(ri.unit)+'" placeholder="eenheid">'+
        '</div>'+
        '<input type="text" class="note" data-f="comment" value="'+esc(ri.comment)+'" placeholder="opmerking">'+
      '</div>'+
    '</div>'+
    '<button class="iconbtn danger" data-rmrow="'+i+'">🗑</button>'+
  '</div>';
}
function productOptions(selId){
  var out = '<option value="__free__"'+(selId?'':' selected')+'>✎ vrij item</option>';
  S.products.slice().sort(function(a,b){ return a.name.localeCompare(b.name,'nl'); }).forEach(function(p){
    out += '<option value="'+p.id+'"'+(p.id===selId?' selected':'')+'>'+esc(p.name)+'</option>';
  });
  return out;
}
function bindRecipeCard(r){
  var up = view.querySelector('[data-mup="'+r.id+'"]');
  if (up) up.addEventListener('click', function(){
    if (moveRecipe(r.id, -1)) renderRecepten();
  });
  var down = view.querySelector('[data-mdown="'+r.id+'"]');
  if (down) down.addEventListener('click', function(){
    if (moveRecipe(r.id, 1)) renderRecepten();
  });
  view.querySelectorAll('[data-openrec="'+r.id+'"]').forEach(function(b){
    b.addEventListener('click', function(){
      expandedRecipe = (expandedRecipe===r.id) ? null : r.id;
      renderRecepten();
    });
  });
  var inline = view.querySelector('[data-openrec-inline="'+r.id+'"]');
  if (inline) inline.addEventListener('click', function(){
    expandedRecipe = r.id; renderRecepten();
  });
  var nameInp = view.querySelector('[data-rname="'+r.id+'"]');
  if (nameInp) nameInp.addEventListener('change', function(){ r.name = nameInp.value; save(); });
  view.querySelectorAll('[data-rmrec="'+r.id+'"]').forEach(function(b){
    b.addEventListener('click', function(){
      if (!confirm('"'+(r.name||'deze lijst')+'" verwijderen?')) return;
      S.recipes = S.recipes.filter(function(x){ return x.id!==r.id; });
      if (expandedRecipe===r.id) expandedRecipe=null;
      save(); renderRecepten();
    });
  });
  view.querySelectorAll('[data-addrow="'+r.id+'"]').forEach(function(b){
    b.addEventListener('click', function(){
      r.items.push({ productId:null, name:'', amount:'', unit:'', comment:'' });
      save(); renderRecepten();
    });
  });
  view.querySelectorAll('[data-newprod="'+r.id+'"]').forEach(function(b){
    b.addEventListener('click', function(){
      openProductModal(null, function(p){
        r.items.push({ productId:p.id, name:p.name, amount:'', unit:p.unit||'', comment:'' });
        save(); renderRecepten();
      });
    });
  });
  view.querySelectorAll('.rrow').forEach(function(rowEl){
    if (rowEl.dataset.bound) return;
    rowEl.dataset.bound = '1';
    var rid = rowEl.closest('.rcard') ? rowEl.closest('.rcard').querySelector('[data-rmrec]').dataset.rmrec : null;
    var rec = recipeById(rid); if (!rec) return;
    var ri = rec.items[Number(rowEl.dataset.ridx)];
    if (!ri) return;
    rowEl.querySelectorAll('[data-f]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var f = inp.dataset.f;
        if (f==='productId'){
          if (inp.value==='__free__'){ ri.productId=null; if(!ri.name) ri.name=''; }
          else { var p = prodById(inp.value); ri.productId=inp.value; if (p){ ri.name=p.name; if(!ri.unit) ri.unit=p.unit||''; } }
          save(); renderRecepten(); return;
        }
        if (f==='amount'){ var n = num(inp.value); if (n!=null) ri.amount = n; }
        else ri[f] = inp.value;
        save();
      });
    });
    rowEl.querySelector('[data-rmrow]').addEventListener('click', function(){
      rec.items.splice(Number(rowEl.dataset.ridx), 1);
      save(); renderRecepten();
    });
  });
}

/* ---------- TAB: WINKELS ---------- */
function renderWinkels(){
  view.innerHTML =
  '<div class="card">'+
    '<h2>Winkels & looproute</h2>'+
    '<p class="hint">Leg hier per winkel vast in welke volgorde je loopt. De nummers bepalen de volgorde op de boodschappenlijst: begin van de winkel bovenaan, kassa onderaan.</p>'+
  '</div>'+
  S.stores.map(function(s){ return storeCardHtml(s); }).join('')+
  '<div class="card">'+
    '<h2>Nieuwe winkel</h2>'+
    '<div class="rowflex"><input type="text" id="newStoreName" placeholder="Naam winkel" style="flex:1;min-width:150px">'+
    '<button class="btn primary" id="addStoreBtn">➕ Toevoegen</button></div>'+
  '</div>';
  S.stores.forEach(bindStoreCard);
  $('#addStoreBtn').addEventListener('click', function(){
    var nm = $('#newStoreName').value.trim();
    if (!nm){ toast('Vul een naam in'); return; }
    S.stores.push({ id:uid('st'), name:nm, locations:[] });
    save(); renderWinkels();
  });
}
function storeCardHtml(s){
  return '<div class="card" data-store="'+s.id+'">'+
    '<div class="rowflex" style="margin-bottom:8px">'+
      '<input type="text" value="'+esc(s.name)+'" data-sname="'+s.id+'" style="flex:1;min-width:150px;font-weight:700">'+
      '<button class="iconbtn danger" data-rmstore="'+s.id+'">🗑</button>'+
    '</div>'+
    '<ul class="loclist">'+
      s.locations.map(function(l, i){
        return '<li><span class="locnr">'+(i+1)+'</span>'+
          '<input type="text" value="'+esc(l.name)+'" data-lname="'+s.id+'|'+l.id+'" placeholder="Afdeling">'+
          '<button class="iconbtn" data-locup="'+i+'">↑</button>'+
          '<button class="iconbtn" data-locdown="'+i+'">↓</button>'+
          '<button class="iconbtn danger" data-rmloc="'+l.id+'">✕</button>'+
        '</li>';
      }).join('')+
    '</ul>'+
    '<div class="rowflex" style="margin-top:8px">'+
      '<input type="text" id="newloc-'+s.id+'" placeholder="Nieuwe afdeling (bijv. Bakkerij)" style="flex:1;min-width:150px">'+
      '<button class="btn" data-addloc="'+s.id+'">➕ Afdeling</button>'+
    '</div>'+
  '</div>';
}
function bindStoreCard(s){
  var card = view.querySelector('[data-store="'+s.id+'"]');
  if (!card) return;
  card.querySelector('[data-sname]').addEventListener('change', function(e){ s.name = e.target.value; save(); });
  card.querySelectorAll('[data-lname]').forEach(function(inp){
    inp.addEventListener('change', function(){
      var parts = inp.dataset.lname.split('|');
      var l = locById(parts[0], parts[1]);
      if (l){ l.name = inp.value.trim() || l.name; inp.value = l.name; save(); }
    });
  });
  card.querySelectorAll('[data-locup]').forEach(function(b){
    b.addEventListener('click', function(){
      var i = Number(b.dataset.locup); if (i<=0) return;
      var t = s.locations[i-1]; s.locations[i-1]=s.locations[i]; s.locations[i]=t;
      save(); renderWinkels();
    });
  });
  card.querySelectorAll('[data-locdown]').forEach(function(b){
    b.addEventListener('click', function(){
      var i = Number(b.dataset.locdown); if (i>=s.locations.length-1) return;
      var t = s.locations[i+1]; s.locations[i+1]=s.locations[i]; s.locations[i]=t;
      save(); renderWinkels();
    });
  });
  card.querySelectorAll('[data-rmloc]').forEach(function(b){
    b.addEventListener('click', function(){
      var l = locById(s.id, b.dataset.rmloc); if (!l) return;
      if (!confirm('Afdeling "'+l.name+'" verwijderen? Producten komen dan bij "zonder vaste plek".')) return;
      s.locations = s.locations.filter(function(x){ return x.id!==l.id; });
      S.products.forEach(function(p){ if (p.storeId===s.id && p.locationId===l.id) p.locationId=null; });
      S.list.forEach(function(it){ if (it.storeId===s.id && it.locationId===l.id) it.locationId=null; });
      save(); renderWinkels();
    });
  });
  card.querySelectorAll('[data-addloc]').forEach(function(b){
    b.addEventListener('click', function(){
      var inp = card.querySelector('[id^="newloc-"]');
      var val = inp ? inp.value.trim() : '';
      if (!val){ toast('Vul een naam in'); return; }
      s.locations.push({ id:uid('loc'), name:val });
      save(); renderWinkels();
    });
  });
  card.querySelector('[data-rmstore]').addEventListener('click', function(){
    if (!confirm('Winkel "'+s.name+'" verwijderen? Producten blijven bestaan maar krijgen geen winkel meer.')) return;
    S.stores = S.stores.filter(function(x){ return x.id!==s.id; });
    S.products.forEach(function(p){ if (p.storeId===s.id){ p.storeId=null; p.locationId=null; } });
    S.list.forEach(function(it){ if (it.storeId===s.id){ it.storeId=null; it.locationId=null; } });
    save(); renderWinkels();
  });
}

/* ---------- synchronisatie tussen telefoons ( privé-opslag op GitHub ) ---------- */
var SYNC = { on:false, token:'', owner:'', repo:'', file:'data.json', branch:'main' };
var DEV = 'onbekend-toestel';
var SYNC_SEEN_SHA = '';
var syncBusy = false, syncDirtyFlag = false, syncTimer = null, pushTimer = null;
var pendingSyncState = null;
var lastSyncAt = 0;
try {
  var scfg = JSON.parse(localStorage.getItem('boodschappen-app-sync') || 'null');
  if (scfg && scfg.token){
    SYNC.on = true; SYNC.token = scfg.token; SYNC.owner = scfg.owner || ''; SYNC.repo = scfg.repo || ''; SYNC.branch = scfg.branch || 'main';
  }
  var dvc = localStorage.getItem('boodschappen-app-device');
  if (dvc){ DEV = dvc; }
  else { DEV = 'tel-' + new Date().getTime().toString(36) + Math.floor(Math.random()*1679615).toString(36); localStorage.setItem('boodschappen-app-device', DEV); }
  SYNC_SEEN_SHA = localStorage.getItem('boodschappen-app-seensha') || '';
} catch(e){}

function syncSafeParse(s){ try { return JSON.parse(s); } catch(e){ return null; } }
function syncB64dec(b64){
  var bin = atob(String(b64).replace(/\s/g, ''));
  try { return decodeURIComponent(escape(bin)); } catch(e){ return bin; }
}
function syncB64enc(str){ return btoa(unescape(encodeURIComponent(str))); }
function syncHeaders(extra){
  var h = { 'Authorization':'Bearer ' + SYNC.token, 'Accept':'application/vnd.github+json' };
  for (var k in (extra||{})) h[k] = extra[k];
  return h;
}
function syncDot(state){
  var d = document.getElementById('syncdot'); if (!d) return;
  if (!SYNC.on){ d.style.display = 'none'; return; }
  d.style.display = 'inline-block';
  d.title = 'Synchroniseren: ' + state;
  d.style.background = state==='fout' ? 'var(--danger)' : state==='bezig' ? 'var(--warn)' : state==='ok' ? 'var(--accent)' : '#cfd6d0';
}
function syncPersist(){
  try { localStorage.setItem('boodschappen-app-sync', JSON.stringify({ token:SYNC.token, owner:SYNC.owner, repo:SYNC.repo, branch:SYNC.branch })); } catch(e){}
}
function syncSeenSave(){ try { localStorage.setItem('boodschappen-app-seensha', SYNC_SEEN_SHA || ''); } catch(e){} }

function syncKeyOf(it){ return (it.productId || it.id || it.name || '') + '|' + (it.unit || ''); }
function syncMerge(local, remote){
  var out = normalizeState(JSON.parse(JSON.stringify(remote)));
  var byId = {};
  ['stores','products','recipes'].forEach(function(k){
    byId[k] = {};
    out[k].forEach(function(x){ byId[k][x.id] = x; });
    local[k].forEach(function(x){
      if (!x || !x.id) return;
      if (byId[k][x.id]){ out[k][out[k].indexOf(byId[k][x.id])] = x; byId[k][x.id] = x; }
      else { out[k].push(x); byId[k][x.id] = x; }
    });
  });
  var seenL = {}, mergedList = [];
  local.list.forEach(function(it){ if (!seenL[syncKeyOf(it)]){ mergedList.push(it); seenL[syncKeyOf(it)] = 1; } });
  remote.list.forEach(function(it){ if (!seenL[syncKeyOf(it)]){ mergedList.push(it); seenL[syncKeyOf(it)] = 1; } });
  out.list = mergedList;
  out.recent = mergeRecent(local.recent||[], remote.recent||[]);
  out.appVersion = Math.max((local.appVersion||1),(remote.appVersion||1));
  out.savedAt = Math.max((local.savedAt||0),(remote.savedAt||0));
  out.rev = Math.max((local.rev||0),(remote.rev||0));
  return out;
}
function syncApply(remote){
  var merged = syncMerge(S, remote);
  if (modalHost && !modalHost.hidden){ pendingSyncState = merged; return; } /* pas nadat het venster gesloten is */
  var changed = JSON.stringify(merged) !== JSON.stringify(S);
  S = merged;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  if (changed) render();
}
function ghGetRemote(useEtag){
  var h = syncHeaders();
  if (useEtag && SYNC_SEEN_SHA) h['If-None-Match'] = SYNC_SEEN_SHA;
  return fetch('https://api.github.com/repos/' + SYNC.owner + '/' + SYNC.repo + '/contents/' + SYNC.file, { headers:h, cache:'no-store' })
    .then(function(r){
      if (r.status === 304) return { code:304 };
      if (r.status === 404) return { code:404 };
      if (!r.ok) throw new Error('GitHub-status ' + r.status);
      return r.json().then(function(j){ return { code:200, sha:j.sha, raw:syncB64dec(j.content) }; });
    });
}
function ghPutRemote(json, sha, attempt){
  var body = { message:'Boodschappenlijst vanaf ' + DEV, branch:SYNC.branch, content:syncB64enc(json) };
  if (sha) body.sha = sha;
  return fetch('https://api.github.com/repos/' + SYNC.owner + '/' + SYNC.repo + '/contents/' + SYNC.file, { method:'PUT', headers:syncHeaders(), body:JSON.stringify(body) })
    .then(function(r){
      if (r.status===409 || r.status===422){
        if (attempt > 0){ return ghGetRemote(false).then(function(g){ return ghPutRemote(json, g.code===200 ? g.sha : sha, attempt-1); }); }
        return { ok:false };
      }
      if (!r.ok) return { ok:false };
      return { ok:true };
    })
    .catch(function(){ return { ok:false }; });
}
function schedulePush(){
  if (!SYNC.on || typeof fetch !== 'function') return;
  syncDirtyFlag = true; syncDot('wacht');
  if (!pushTimer) pushTimer = window.setTimeout(function(){ pushTimer = null; pushSync(); }, 2000);
}
function pushSync(attempt){
  if (!SYNC.on || typeof fetch !== 'function') return;
  if (syncBusy){ schedulePush(); return; }
  syncBusy = true; syncDot('bezig');
  ghGetRemote(false).then(function(g){
    var payloadState;
    if (g.code===200){
      var remote = syncSafeParse(g.raw);
      payloadState = remote ? syncMerge(normalizeState(S), normalizeState(remote)) : normalizeState(S);
      var changed = JSON.stringify(payloadState) !== JSON.stringify(S);
      S = payloadState;
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
      if (changed && (!modalHost || modalHost.hidden)) render();
    } else {
      payloadState = normalizeState(S);
    }
    var json = JSON.stringify(payloadState);
    ghPutRemote(json, g.code===200 ? g.sha : null, attempt||2).then(function(res){
      syncBusy = false;
      if (res.ok){ syncDirtyFlag = false; lastSyncAt = Date.now(); syncDot('ok'); }
      else { syncDot('fout'); schedulePush(); }
    });
  }).catch(function(){ syncBusy = false; syncDot('fout'); schedulePush(); });
}
function pullSync(){
  if (!SYNC.on || typeof fetch !== 'function' || syncBusy) return;
  syncBusy = true; syncDot('bezig');
  ghGetRemote(true).then(function(g){
    syncBusy = false;
    if (g.code===304){ lastSyncAt = Date.now(); syncDot(syncDirtyFlag ? 'wacht' : 'ok'); return; }
    if (g.code===404){ syncDot('wacht'); return; } /* nog niets op GitHub: de volgende opslag maakt het bestand aan */
    SYNC_SEEN_SHA = g.sha; syncSeenSave();
    lastSyncAt = Date.now();
    var remote = syncSafeParse(g.raw);
    if (remote && !syncDirtyFlag) syncApply(normalizeState(remote)); /* eigen wijzigingen nog niet verzonden: de push doet de samenvoeging */
    syncDot(syncDirtyFlag ? 'wacht' : 'ok');
  }).catch(function(){ syncBusy = false; syncDot('fout'); });
}
function startSyncTimer(){
  if (syncTimer || !SYNC.on) return;
  syncTimer = window.setInterval(function(){
    if (!SYNC.on) return;
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
    if (document.hidden) return;
    pullSync();
  }, 5000);
}
function initSync(){
  if (!SYNC.on || typeof fetch !== 'function'){ syncDot('uit'); return; }
  syncDot(syncDirtyFlag ? 'wacht' : 'ok');
  startSyncTimer();
  if (typeof navigator === 'undefined' || navigator.onLine !== false) pullSync();
}
function syncFetchUser(token){
  return fetch('https://api.github.com/user', { headers:{ 'Authorization':'Bearer ' + token, 'Accept':'application/vnd.github+json' } })
    .then(function(r){ if (!r.ok) throw new Error('token geweigerd'); return r.json(); });
}
function syncTestRepo(token, owner, repo){
  return fetch('https://api.github.com/repos/' + owner + '/' + repo, { headers:{ 'Authorization':'Bearer ' + token, 'Accept':'application/vnd.github+json' } })
    .then(function(r){ if (!r.ok) throw new Error('privé-opslag niet gevonden'); return r.json(); });
}
function openSyncWindow(){
  var lastTxt = lastSyncAt ? ('Laatst gesynchroniseerd om ' + new Date(lastSyncAt).toLocaleTimeString('nl-NL')) : 'Nog niet gesynchroniseerd op dit toestel.';
  var card = openModal(
    '<h3>🔄 Synchroniseren tussen telefoons</h3>'+
    '<p class="hint">Alles wat je invult (boodschappenlijst, producten, winkels, ingrediëntenlijsten) wordt via een privé-opslag op GitHub gedeeld met het andere toestel: wijzigingen verschijnen daar binnen enkele seconden. Werkt ook even zonder internet; alles wordt aangevuld zodra er weer verbinding is.</p>'+
    '<div class="field"><label>GitHub-token (plak hier je personal access token)</label><input type="password" id="sy-token" placeholder="github_pat_..."></div>'+
    '<div class="field"><label>Privé-opslag (repo) met de gegevens</label><input type="text" id="sy-repo" value="'+esc(SYNC.repo || 'boodschappenlijst-data')+'"></div>'+
    '<button class="btn primary" id="sy-test">Verbinding testen en gebruiken</button>'+
    '<button class="btn" id="sy-now">🔄 Nu synchroniseren</button>'+
    '<button class="btn danger" id="sy-off">Synchronisatie uitzetten</button>'+
    '<hr class="sep">'+
    '<p class="hint" id="sy-status">'+ (SYNC.on ? 'Status: verbonden. ' : 'Status: nog niet ingesteld. ') + esc(lastTxt) +'</p>'+
    '<p class="hint"><b>Token maken (eenmalig, op de computer)</b><br>'+
    '1. Ga op github.com rechtsboven naar je foto → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token.<br>'+
    '2. Kies bij Repository access: Only select repositories → <i>boodschappenlijst-data</i>.<br>'+
    '3. Zet bij Permissions → Repository permissions → Contents op <b>Read and write</b> en genereer de token.<br>'+
    '4. Kopieer de token (begint met github_pat_) en plak die hierboven. Herhaal dit op het andere toestel met dezelfde of een eigen token.</p>'
  );
  card.querySelector('#sy-test').addEventListener('click', function(){
    var token = card.querySelector('#sy-token').value.trim();
    var repo = card.querySelector('#sy-repo').value.trim();
    var stat = card.querySelector('#sy-status');
    if (!token){ stat.textContent = 'Plak eerst je token.'; return; }
    stat.textContent = 'Verbinding testen...';
    syncFetchUser(token).then(function(me){
      return syncTestRepo(token, me.login, repo).then(function(){
        SYNC.on = true; SYNC.token = token; SYNC.owner = me.login; SYNC.repo = repo; SYNC.branch = 'main';
        syncPersist(); syncDot('ok'); startSyncTimer();
        stat.textContent = 'Verbonden als ' + me.login + '. Synchroniseren staat aan voor ' + repo + '.';
        toast('Synchronisatie aangezet');
        pushSync();
      });
    }).catch(function(e){
      stat.textContent = 'Dat lukte niet: ' + (e && e.message ? e.message : 'onbekende fout') + '.';
    });
  });
  card.querySelector('#sy-now').addEventListener('click', function(){
    if (!SYNC.on){ toast('Zet eerst de synchronisatie aan met je token'); return; }
    schedulePush(); pullSync();
    toast('Synchroniseren...');
  });
  card.querySelector('#sy-off').addEventListener('click', function(){
    SYNC.on = false; SYNC.token = ''; syncPersist();
    if (syncTimer){ window.clearInterval(syncTimer); syncTimer = null; }
    syncDot('uit'); toast('Synchronisatie uitgezet op dit toestel');
    card.querySelector('#sy-status').textContent = 'Status: uitgezet op dit toestel.';
  });
}

/* ---------- iPhone: tabbalkhoogte meten voor plakkende-offsets ---------- */
function syncChrome(){
  try {
    var tb = document.getElementById('tabs');
    var rt = document.documentElement;
    if (!tb || !rt.style || !rt.style.setProperty) return;
    rt.style.setProperty('--tabs-h', tb.offsetHeight + 'px');
  } catch(e){}
}
if (typeof window.addEventListener === 'function'){
  window.addEventListener('resize', syncChrome);
  window.addEventListener('orientationchange', syncChrome);
}

/* ---------- start ---------- */
render();
syncChrome();
initSync();

/* ---------- automatische update-check (Beginscherm-app van iPhone cachet hard) ---------- */
function checkUpdate(){
  fetch('version.txt?nc=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ return r.ok ? r.text() : ''; })
    .then(function(t){
      var remote = parseInt((t || '').trim(), 10);
      if (!remote || remote <= (S.appVersion || 1)) return;
      if (sessionStorage.getItem('boodschappen-app-upd') === ('' + remote)) return;
      sessionStorage.setItem('boodschappen-app-upd', '' + remote);
      save();
      toast('Nieuwe versie beschikbaar, wordt geladen...');
      var base = location.href.split('#')[0].split('?')[0];
      setTimeout(function(){ location.replace(base + '?v=' + remote + '&nc=' + Date.now()); }, 700);
    })
    .catch(function(){ /* offline: niets doen, app werkt gewoon door */ });
}
checkUpdate();
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState !== 'visible') return;
  fetch('version.txt?nc=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ return r.ok ? r.text() : ''; })
    .then(function(t){
      var remote = parseInt((t || '').trim(), 10);
      if (!remote || remote <= (S.appVersion || 1)) return;
      if (sessionStorage.getItem('boodschappen-app-upd') === ('' + remote)) return;
      toast('Nieuwe versie beschikbaar: veeg de app weg en start opnieuw');
    })
    .catch(function(){});
});
})();
